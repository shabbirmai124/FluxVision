name: flux_vision
description: 100% Pure Flutter offline AR electromagnetic, BLE RF, and acoustic spatial field scanner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  camera: ^0.12.2
  sensors_plus: ^7.1.1
  flutter_blue_plus: ^2.3.15
  noise_meter: ^6.0.0
  permission_handler: ^13.0.1
  vector_math: ^2.4.4
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
